[package]
name = "edgelink-core"
version = "0.3.0"
edition = "2024"
readme = "README.md"
authors = ["Li Wei <oldrev@gmail.com>"]

[lib]
name = "edgelink_core"

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "fs",
    "net",
    "sync",
    "io-util",
    "io-std",
    "process",
] }
config.workspace = true
async-trait.workspace = true
log.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
nom.workspace = true
bumpalo.workspace = true
regex.workspace = true
tokio-cron-scheduler.workspace = true
chrono.workspace = true
semver.workspace = true
rquickjs = { optional = true, workspace = true }
rquickjs-extra = { optional = true, workspace = true }
#llrt_modules = { optional = true, workspace = true }
rand.workspace = true
base64.workspace = true
uuid.workspace = true
# Serialization stuff
bytes.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_with.workspace = true
bincode.workspace = true
sha2.workspace = true
hex.workspace = true
chacha20poly1305 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
# Template engine and YAML support
mustache = "0.9.0"
serde_yaml_ng = { version = "0.10.0", optional = true }
# URL encoding
urlencoding = { version = "2.1", optional = true }
# URL parsing
url = "2.5"
# XML parsing
quick-xml = { workspace = true, optional = true, features = ["serialize"] }
serde-xml-rs = { workspace = true, optional = true }
# Crates in this project
edgelink-macro = { path = "../macro" }
dashmap.workspace = true
itertools.workspace = true
smallvec.workspace = true
smallstr.workspace = true
inventory.workspace = true
arrayvec = { workspace = true, features = ["std", "serde"] }
notify = { version = "^8.0", optional = true }
rumqttc = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true, features = ["rustls-tls-native-roots"] }
futures-util.workspace = true
reqwest = { workspace = true, optional = true }
axum.workspace = true
jsonata-core = { optional = true, workspace = true }
rusqlite = { optional = true, workspace = true }
tokio-postgres = { optional = true, workspace = true }
redis = { optional = true, workspace = true }

# The exec node delivers a real SIGTERM/SIGINT on Unix. Windows has no equivalent (Node.js
# terminates the process there whatever signal is named), so this is Unix-only.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Enable test-utilities in dev mode only. This is mostly for tests.
tokio = { workspace = true, features = ["test-util"] }
log4rs.workspace = true
ctor.workspace = true
futures.workspace = true


[features]
default = ["core", "js", "jsonata", "nodes_network", "nodes_storage", "nodes_parser"]
core = []
pymod = []
#js = ["rquickjs", "rquickjs-extra", "llrt_modules"]
js = ["rquickjs", "rquickjs-extra"]
jsonata = ["jsonata-core"]
rqjs_bindgen = ["js", "rquickjs/bindgen"]
nodes_network = ["nodes_mqtt", "nodes_udp", "nodes_tcp", "nodes_http", "nodes_websocket"]
nodes_parser = ["nodes_xml", "nodes_yaml"]
nodes_storage = ["nodes_storage_watch"]
nodes_mqtt = ["rumqttc"]
nodes_http = ["tokio/net", "reqwest", "urlencoding"]
nodes_tcp = ["tokio/net"]
nodes_udp = ["tokio/net"]
nodes_websocket = ["tokio-tungstenite"]
nodes_storage_watch = ["notify"]
nodes_xml = ["quick-xml", "serde-xml-rs"]
nodes_yaml = ["serde_yaml_ng"]
# Soft real-time scan task. Off unless a build asks for it. See the README.
runtime_scan = []
# Modbus TCP. Off unless a build asks for it. Serial RTU is not included.
nodes_modbus = []
# OpenAI, xAI, Anthropic, and Snowflake Cortex chat. Off unless a build asks for it.
nodes_ai = ["reqwest"]
nodes_ai_text = []
nodes_ai_embeddings = ["nodes_ai"]
nodes_ai_agent = ["nodes_ai"]
credential_encryption = ["dep:chacha20poly1305", "dep:zeroize", "dep:fs2"]
# SQLite operational history. The app default enables this; omit from a minimal core build.
history_sqlite = ["dep:rusqlite"]
# PostgreSQL query node. The app default enables this; omit from a minimal core build.
nodes_postgres = ["dep:tokio-postgres"]
# Redis GET/SET/DEL/PING. The app default enables this; omit from a minimal core build.
nodes_redis = ["dep:redis"]
