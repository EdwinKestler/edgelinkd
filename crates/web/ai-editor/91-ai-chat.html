<script type="text/html" data-template-name="ai-chat">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-provider"><i class="fa fa-cloud"></i> Provider</label>
        <input type="text" id="node-input-provider">
    </div>
    <div class="form-row">
        <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
        <input type="text" id="node-input-model" placeholder="provider default">
    </div>
    <div class="form-row">
        <label for="node-input-system"><i class="fa fa-comment"></i> System</label>
        <input type="text" id="node-input-system">
    </div>
    <div class="form-row">
        <label for="node-input-prompt"><i class="fa fa-pencil"></i> Prompt</label>
        <input type="text" id="node-input-prompt" placeholder="msg.payload if empty">
    </div>
    <div class="form-row">
        <label for="node-input-output"><i class="fa fa-ellipsis-h"></i> Output</label>
        <input type="text" id="node-input-output" placeholder="payload">
    </div>
    <div class="form-row">
        <label for="node-input-temperature"><i class="fa fa-thermometer-half"></i> Temperature</label>
        <input type="number" id="node-input-temperature" min="0" max="2" step="0.1" style="width: 80px">
    </div>
    <div class="form-row">
        <label for="node-input-maxTokens"><i class="fa fa-text-width"></i> Max tokens</label>
        <input type="number" id="node-input-maxTokens" min="1" step="1" style="width: 80px">
    </div>
    <div class="form-row">
        <label for="node-input-timeoutMs"><i class="fa fa-clock-o"></i> Timeout</label>
        <input type="number" id="node-input-timeoutMs" min="100" max="120000" step="1" style="width: 100px">
        <span>ms</span>
    </div>
    <div class="form-tips">
        Uses <code>msg.payload</code> as the user prompt when Prompt is empty.
        <code>msg.messages</code> as <code>[{role, content}]</code> is a conversation.
        The reply is written to the output property. <code>msg.ai</code> has provider and model.
        Streaming and tool-calling are rejected.
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("ai-chat", {
        category: "function",
        color: "#E6E0F8",
        defaults: {
            name: {value: ""},
            provider: {value: "", type: "ai-provider", required: true},
            model: {value: ""},
            system: {value: ""},
            prompt: {value: ""},
            output: {value: "payload"},
            temperature: {value: ""},
            maxTokens: {value: ""},
            timeoutMs: {value: 30000}
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-comments",
        label: function () {
            return this.name || "ai-chat";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        }
    });
</script>
