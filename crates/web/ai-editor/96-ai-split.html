<script type="text/html" data-template-name="ai-split">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-chunkSize"><i class="fa fa-scissors"></i> Chunk size</label>
        <input type="number" id="node-input-chunkSize" min="1" max="8192" placeholder="512" style="width: 100px">
    </div>
    <div class="form-row">
        <label for="node-input-overlap"><i class="fa fa-link"></i> Overlap</label>
        <input type="number" id="node-input-overlap" min="0" placeholder="0" style="width: 100px">
    </div>
    <div class="form-row">
        <label for="node-input-separator"><i class="fa fa-font"></i> Separator</label>
        <input type="text" id="node-input-separator" placeholder="empty = character windows">
    </div>
    <div class="form-row">
        <label for="node-input-maxChunks"><i class="fa fa-list"></i> Max chunks</label>
        <input type="number" id="node-input-maxChunks" min="1" max="256" placeholder="256" style="width: 100px">
    </div>
    <div class="form-row">
        <label for="node-input-property"><i class="fa fa-ellipsis-h"></i> Property</label>
        <input type="text" id="node-input-property" placeholder="payload">
    </div>
    <div class="form-tips">
        Splits a string on Unicode characters. Empty separator uses overlapping windows.
        Chunks share one <code>msg.parts.id</code> for the join node.
    </div>
</script>
<script type="text/javascript">
    RED.nodes.registerType("ai-split", {
        category: "function",
        color: "#E6E0F8",
        defaults: {
            name: {value: ""},
            chunkSize: {value: 512},
            overlap: {value: 0},
            separator: {value: ""},
            maxChunks: {value: 256},
            property: {value: "payload"}
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-scissors",
        label: function () { return this.name || "ai-split"; },
        labelStyle: function () { return this.name ? "node_label_italic" : ""; }
    });
</script>
