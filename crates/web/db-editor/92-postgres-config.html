<script type="text/html" data-template-name="postgres-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name">
    </div>
    <div class="form-row">
        <label for="node-config-input-host"><i class="fa fa-globe"></i> Host</label>
        <input type="text" id="node-config-input-host" placeholder="127.0.0.1">
    </div>
    <div class="form-row">
        <label for="node-config-input-port"><i class="fa fa-random"></i> Port</label>
        <input type="number" id="node-config-input-port" placeholder="5432" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-config-input-database"><i class="fa fa-database"></i> Database</label>
        <input type="text" id="node-config-input-database" placeholder="postgres">
    </div>
    <div class="form-row">
        <label for="node-config-input-user"><i class="fa fa-user"></i> User</label>
        <input type="text" id="node-config-input-user">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-key"></i> Password</label>
        <input type="password" id="node-config-input-password">
    </div>
    <div class="form-tips">TLS (<code>sslmode</code> other than <code>disable</code>) is rejected at deploy. Bound query parameters are not supported. Connections use the shared egress policy.</div>
</script>
<script type="text/javascript">
    RED.nodes.registerType("postgres-config", {
        category: "config",
        defaults: {
            name: {value: ""},
            host: {value: "127.0.0.1", required: true},
            port: {value: 5432, required: true},
            database: {value: "postgres", required: true},
            sslmode: {value: "disable"}
        },
        credentials: { user: {type: "text"}, password: {type: "password"} },
        label: function () { return this.name || this.host || "postgres-config"; }
    });
</script>
