<script type="text/html" data-template-name="redis">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-redis"><i class="fa fa-database"></i> Server</label>
        <input type="text" id="node-input-redis">
    </div>
    <div class="form-row">
        <label for="node-input-command"><i class="fa fa-terminal"></i> Command</label>
        <select id="node-input-command">
            <option value="ping">PING</option>
            <option value="get">GET</option>
            <option value="set">SET</option>
            <option value="del">DEL</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-key"><i class="fa fa-key"></i> Key</label>
        <input type="text" id="node-input-key" placeholder="msg.key or msg.topic">
    </div>
    <div class="form-tips">PING ignores the key. SET uses <code>msg.payload</code> as the value. Other Redis commands are rejected.</div>
</script>
<script type="text/javascript">
    RED.nodes.registerType("redis", {
        category: "storage",
        color: "#a41e11",
        defaults: {
            name: {value: ""},
            redis: {value: "", type: "redis-config", required: true},
            command: {value: "ping"},
            key: {value: ""}
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-key",
        label: function () { return this.name || "redis"; }
    });
</script>
